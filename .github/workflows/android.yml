name: Build Android APK
# Run by hand (Actions tab -> Build Android APK -> Run workflow) or by pushing a tag like v1.0.0.
# Every run signs with the SAME key (android-overlay/orpheus.jks), so each new APK installs over the previous one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: node setup-ai.js
      - run: python scripts/android-prepare.py
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ORPHEUS.apk
      - name: Check the APK (signature, version, minimum Android)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs ORPHEUS.apk | head -12
          "$BT/aapt" dump badging ORPHEUS.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion" || true
          ls -l ORPHEUS.apk
      - name: Publish to the Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ORPHEUS.apk
      - name: 'Publish to the android-latest pre-release (manual builds, direct APK download)'
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ORPHEUS Android (latest build)
          prerelease: true
          make_latest: false
          files: ORPHEUS.apk
