<style>
*{box-sizing:border-box}
:root{--a:#e6e6e6;--vc:#e6e6e6;--sp:1;--r:12px;--bass:0;--l:#4a4a4a;color-scheme:dark}
html,body{height:100%;margin:0}
@media(min-width:960px){html,body{overflow:hidden}}
body{background:radial-gradient(ellipse at 50% 40%,#181818,#000 75%) center/cover fixed;color:#cfefff;font:13px/1.35 "Share Tech Mono",Vazirmatn,ui-monospace,Consolas,monospace;letter-spacing:.04em;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 60%,var(--a),transparent 60%);opacity:calc(.02 + var(--bass)*.12);will-change:opacity}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 3px)}
body.noamb::before{display:none}
header{display:flex;gap:12px;align-items:center;padding:4px 12px;border-bottom:1px solid var(--l);height:44px;flex-wrap:wrap}
.lg{font:700 15px Orbitron,sans-serif;background:var(--a);color:#000;padding:2px 10px;letter-spacing:.3em}
#clk{font:500 15px Orbitron,sans-serif;display:inline-block;transform:scale(calc(1 + var(--bass)*.3))}
#stat{color:#888;font-size:11px;flex:1;min-width:120px}
#wc{display:none;gap:4px;margin-left:8px;padding-left:8px;border-left:1px solid var(--l)}
body.app #wc{display:flex}
#wx:hover{background:#c33;border-color:#c33;color:#fff}
#m{display:grid;grid-template-columns:290px 1fr 320px;gap:10px;padding:10px;height:calc(100% - 44px)}
.pn{background:rgba(8,8,8,.72);border:1px solid #3a3a3a;position:relative;padding:10px;display:flex;flex-direction:column;min-height:0;gap:8px}
.pn::before,.pn::after{content:'';position:absolute;width:22px;height:22px;border:2px solid #fff;pointer-events:none}
.pn::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.pn::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.sc{overflow:auto;flex:1;min-height:0;position:relative}
.sc::-webkit-scrollbar{width:8px}.sc::-webkit-scrollbar-thumb{background:#444}.sc::-webkit-scrollbar-track{background:transparent}
button{background:transparent;color:#ddd;border:1px solid #777;border-radius:var(--r);padding:4px 8px;font:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.1em}
button:hover{background:#222;border-color:#fff;color:#fff}
button.on{background:#e6e6e6;color:#000}
input,select,textarea{background:#000;color:inherit;border:1px solid #555;border-radius:var(--r);font:inherit;padding:3px;max-width:100%}
input[type=search]{width:100%;margin-bottom:4px}
input[type=range]{accent-color:var(--a);padding:0;width:100%}
input[type=range]:not(.vr){-webkit-appearance:none;appearance:none;background:transparent;height:16px}
input[type=range]:not(.vr)::-webkit-slider-runnable-track{height:2px;background:#777}
input[type=range]:not(.vr)::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:16px;background:#fff;border:0;border-radius:0;margin-top:-7px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{padding:3px 6px;font-size:11px}
.row{display:flex;gap:4px;align-items:center;padding:5px 4px;border-bottom:1px solid #222;content-visibility:auto;contain-intrinsic-size:auto 27px}
.row:hover{background:rgba(255,255,255,.06)}
.row.on{color:#fff;background:rgba(255,255,255,.12)}
.row .n{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.row[draggable=true]{cursor:grab}
.empty{color:#999;padding:8px 2px;line-height:1.6}
h4{display:inline-block;background:#ddd;color:#000;padding:1px 8px;margin:10px 0 4px;font:500 10px Orbitron,sans-serif;letter-spacing:.2em}
details{margin-top:8px;border-top:1px solid #222;padding-top:4px}
summary{cursor:pointer;color:#ddd;font:500 11px Orbitron,sans-serif;letter-spacing:.2em;padding:4px 0}
summary:hover{color:#fff}
#top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
#dw{position:relative;width:min(100%,38vh,400px);aspect-ratio:1}
#dial{position:absolute;inset:0;width:100%;height:100%}
#art{position:absolute;inset:27%;border-radius:50%;border:1px solid #fff;display:grid;place-items:center;overflow:hidden;color:#888;font-size:11px;box-shadow:0 0 0 calc(var(--bass)*14px) rgba(255,255,255,.12)}
#art img{width:100%;height:100%;object-fit:cover;display:none}
#inf{min-width:0;max-width:100%}
#ti{font:700 16px Orbitron,Vazirmatn,sans-serif;color:#fff;overflow-wrap:anywhere;unicode-bidi:plaintext}
#ar{color:#aaa;unicode-bidi:plaintext}
canvas{width:100%;display:block}#vz{height:36px}#wf{height:56px;cursor:pointer;border:1px solid #555}
#rl2{position:relative;height:14px;margin-top:-6px;background:repeating-linear-gradient(90deg,#888 0 1px,transparent 1px 8px) bottom/100% 5px no-repeat,repeating-linear-gradient(90deg,#ddd 0 1px,transparent 1px 40px) bottom/100% 9px no-repeat}
#mk{position:absolute;top:-4px;font-size:10px;font-style:normal;transform:translateX(-50%);color:#fff}
#gs{display:flex;justify-content:center;gap:14px}.g{width:74px!important;height:74px!important}
#ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
#ctl button{min-width:40px}#pp{font-size:16px;border-radius:50%;width:48px;height:48px;min-width:0;padding:0}
#ctl input[type=range]{width:110px}
#ly{text-align:center;min-height:90px}#ly div{padding:3px;color:#666;transition:color .2s;unicode-bidi:plaintext}#ly div.on{color:#fff;font-size:17px}
.sl{display:grid;grid-template-columns:78px 1fr 44px;gap:4px;align-items:center}.sl em{font-style:normal;color:#999;text-align:right;font-size:11px}
small{color:#999}
.eqb{display:flex;justify-content:space-between}.bd{display:flex;flex-direction:column;align-items:center;font-size:10px}
.vr{writing-mode:vertical-lr;direction:rtl;width:22px;height:90px}
.flex{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
body.focus .side,body.focus #ly,body.focus #vz,body.room .side{display:none}
body.focus #m,body.room #m{grid-template-columns:minmax(0,640px);justify-content:center}
body.room #dw{width:min(70vh,560px)}body.room #vz{height:22vh}body.room #ly div.on{font-size:24px}
#cm{position:fixed;z-index:99;display:none;min-width:200px;background:#0b0b0b;border:1px solid #fff;padding:3px 0;box-shadow:0 8px 30px #000;font-size:12px;user-select:none}
#cm div{padding:5px 16px;cursor:pointer;white-space:nowrap;position:relative;color:#ddd}
#cm div:hover{background:#e6e6e6;color:#000}
#cm hr{border:0;border-top:1px solid #333;margin:3px 0}
#cm .dis{opacity:.35;pointer-events:none}
#cm .arrow::after{content:'▸';float:right;margin-left:22px}
#cm .sub{display:none;position:absolute;left:100%;top:-4px;min-width:190px;background:#0b0b0b;border:1px solid #fff;padding:3px 0;cursor:default}
#cm div:hover>.sub{display:block}
#cm.fl .sub{left:auto;right:100%}
body.app #bdl{display:none}
#dlo{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.78);padding:16px;overflow:auto}
#dlo.show{display:flex}
#dlb{background:#080808;border:1px solid #fff;max-width:760px;width:100%;padding:20px;position:relative;box-shadow:0 10px 50px #000;margin:auto}
#dlb h3{margin:0 0 4px;font:700 18px Orbitron,sans-serif;letter-spacing:.2em;color:#fff}
#dlb .sub{color:#999;margin-bottom:14px}
#dlb .cards{display:flex;gap:12px;flex-wrap:wrap}
#dlb .card{flex:1 1 280px;border:1px solid #444;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
#dlb .card.win{border-color:#fff;background:rgba(255,255,255,.05)}
#dlb .card b{font:500 12px Orbitron,sans-serif;letter-spacing:.2em;color:#fff}
#dlb .card ul{margin:0;padding-left:18px;color:#bbb;line-height:1.7;flex:1}
#dlb .tag{align-self:flex-start;background:#ddd;color:#000;font-size:10px;padding:1px 8px;letter-spacing:.15em}
#dlb a.btn,#dlb button.btn{display:block;text-align:center;text-decoration:none;color:#ddd;border:1px solid #777;border-radius:var(--r);padding:8px;font:inherit;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;background:transparent}
#dlb a.btn:hover,#dlb button.btn:hover{background:#222;border-color:#fff;color:#fff}
#dlb a.btn.pri{background:#e6e6e6;color:#000;border-color:#e6e6e6}
#dlb a.btn.pri:hover{background:#fff}
#dlb .note{color:#999;font-size:11px;margin-top:2px}
#dlx{position:absolute;top:8px;right:8px;padding:2px 8px}
@media(max-width:959px){
html{-webkit-text-size-adjust:100%}html,body{height:auto}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{height:auto;min-height:44px;padding:6px 10px;gap:6px 8px}
#m{grid-template-columns:minmax(0,1fr);height:auto;padding:8px;gap:8px}
#C{order:-1}
#dw{width:min(76vw,34vh,340px)}
#top{order:1}#ctl{order:2}#wf{order:3}#rl2{order:4}#vz{order:5}#gs{order:6}#ly{order:7}
#ll{max-height:48vh;max-height:48dvh}
#rr{max-height:none;overflow:visible}
#ly{min-height:48px;max-height:30vh}
.g{width:64px!important;height:64px!important}#gs{gap:10px}
#ctl{flex-wrap:nowrap;gap:10px;width:100%}
#ctl button{min-width:44px;min-height:44px}
#ctl #pp{width:60px;height:60px;font-size:20px;min-height:0}
#ctl input[type=range]{width:auto;flex:1 1 80px;min-width:70px}
.sl{grid-template-columns:92px 1fr 40px}
#dlb{padding:16px}
}
/* small tablets: player on top, library and settings side by side */
@media(min-width:600px) and (max-width:959px){#m{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#C{grid-column:1/-1}}
/* phones in portrait: header wraps into clean rows */
@media(max-width:599px){
.lg{order:1}#clk{order:2;margin-left:auto}header::after{content:'';order:2;flex:1 0 100%;height:0}
header>button{order:3;flex:1 1 auto;min-height:40px;padding:6px 10px}
#stat{order:4;flex:1 1 100%;min-width:0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* phones in landscape: player left, library + settings stacked on the right */
@media(max-width:959px) and (orientation:landscape) and (max-height:520px){
#m{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
#m>#C{grid-column:1;grid-row:1/span 2;order:0}
#m>section:nth-child(1){grid-column:2;grid-row:1}
#m>section:nth-child(3){grid-column:2;grid-row:2}
#dw{width:min(36vh,190px)}
#ll{max-height:70vh}
body.focus #m>#C,body.room #m>#C{grid-column:1/-1;grid-row:auto}
}
/* touch screens: bigger tap targets, no iOS zoom-on-focus, tap-friendly menus */
@media(pointer:coarse){
button,.row,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{min-height:40px;padding:8px 12px}
header button{min-height:32px;padding:4px 10px}
.tabs button{min-height:36px;padding:6px 10px;font-size:12px}
input,select,textarea{font-size:16px;padding:8px}
input[type=range]{padding:0}
.row{padding:12px 6px;contain-intrinsic-size:auto 46px}
input[type=range]:not(.vr){height:32px}
input[type=range]:not(.vr)::-webkit-slider-runnable-track{height:4px}
input[type=range]:not(.vr)::-webkit-slider-thumb{width:16px;height:28px;margin-top:-12px}
.vr{width:30px;height:130px}
summary{padding:10px 0}
#cm{max-height:calc(100vh - 12px);max-height:calc(100dvh - 12px);overflow-y:auto}
#cm div{padding:12px 18px}
#cm .sub{position:static;border:0;border-left:1px solid #555;margin:6px 0 0 6px;padding:0;min-width:0}
#cm div:hover>.sub{display:none}
#cm div.open>.sub{display:block}
#cm.fl .sub{left:auto;right:auto}
}
@media(max-width:599px) and (pointer:coarse){header>button{min-height:40px;padding:6px 10px}}

#itext{font-weight:700;letter-spacing:.18em;padding-left:.18em;white-space:nowrap;line-height:1;margin:0}

#intro button{all:unset;box-sizing:border-box;position:fixed;cursor:pointer;font:11px/1 'Share Tech Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#000;opacity:.5;padding:14px 16px;transition:opacity .2s,color .9s}
